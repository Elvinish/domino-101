services:
  postgres:
    image: postgres:18.6-alpine
    environment:
      POSTGRES_DB: domino101
      POSTGRES_USER: domino
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    ports:
      - '127.0.0.1:5432:5432'
    volumes:
      - domino101-postgres:/var/lib/postgresql

volumes:
  domino101-postgres:
